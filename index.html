<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ایسم‌کست | IsmCast Podcast</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px 15px;
            position: relative;
            background: #0d0c08;
            overflow-x: hidden;
            color: #ffffff;
        }

        /* هاله نورانی زرد-طلایی مطابق تم کاور */
        body::before {
            content: "";
            position: absolute;
            width: 320px;
            height: 320px;
            background: linear-gradient(135deg, #eab308, #f59e0b);
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.25;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 480px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* فریم دور لوگو */
        .avatar-wrapper {
            position: relative;
            margin-bottom: 16px;
        }

        .avatar {
            width: 105px;
            height: 105px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(234, 179, 8, 0.8);
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.4);
        }

        /* عنوان و بیو */
        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #ffffff;
        }

        .handle {
            font-size: 0.9rem;
            color: #f59e0b;
            margin-bottom: 16px;
            direction: ltr;
            letter-spacing: 0.5px;
        }

        p.bio {
            font-size: 0.9rem;
            line-height: 1.6;
            color: #d1d5db;
            margin-bottom: 28px;
            padding: 0 10px;
        }

        /* دکمه‌ها */
        .links-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .link-card {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 16px 20px;
            background: rgba(255, 255, 255, 0.05);
            color: #ffffff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 600;
            font-size: 0.95rem;
            transition: all 0.25s ease-in-out;
            border: 1px solid rgba(234, 179, 8, 0.2);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .link-card:hover {
            background: rgba(234, 179, 8, 0.15);
            transform: translateY(-2px);
            border-color: rgba(234, 179, 8, 0.6);
            box-shadow: 0 6px 20px rgba(234, 179, 8, 0.3);
        }

        .footer {
            margin-top: 36px;
            opacity: 0.5;
            font-size: 0.75rem;
            color: #a1a1aa;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- لوگوی پادکست -->
        <div class="avatar-wrapper">
            <img class="avatar" src="./photo_6030706551644949563_y.jpg" alt="ایسم‌کست">
        </div>

        <h1>ایسم‌کست | IsmCast</h1>
        <div class="handle">@ismcast</div>

        <!-- بیو اختصاصی -->
        <p class="bio">
            ایسم‌کست از یک سوال ساده حین پیاده‌روی شروع شد:<br>
            چرا این‌همه مفهوم مهم در جهان به «ایسم» ختم می‌شوند؟
        </p>

        <!-- لینک‌های پلتفرم‌ها -->
        <div class="links-wrapper">
            <a href="https://castbox.fm/vd/940214627" target="_blank" class="link-card">🎙 شنیدن در کست‌باکس (Castbox)</a>
            <a href="https://open.spotify.com/show/5c15Jkz26DDegYNruiCSSi?si=-Ja9SdSqS6aWAJM60wqnXQ" target="_blank" class="link-card">🎧 شنیدن در اسپاتیفای (Spotify)</a>
            <a href="https://podcasts.apple.com/us/podcast/ismcast-%D8%A7%DB%8C%D8%B3%D9%85-%DA%A9%D8%B3%D8%AA/id1896183960" target="_blank" class="link-card">🍎 شنیدن در اپل پادکست (Apple Podcast) </a>
            <a href="https://t.me/ismcast" target="_blank" class="link-card">✈️ کانال تلگرام</a>
        </div>
<a href="https://mehrnooshm75.github.io/podcast/" target="_blank" class="link-card">✨ شنیدن پادکست زنان در علم</a>
        <div class="footer">
            IsmCast Podcast
        </div>
    </div>

</body>
</html>
